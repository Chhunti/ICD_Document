
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocuFlow Sign In</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top left, rgba(11, 59, 92, 0.12), transparent 28%),
                        radial-gradient(circle at bottom right, rgba(46, 134, 171, 0.12), transparent 22%),
                        var(--gray-50);
        }
        .signin-shell {
            width: min(100%, 480px);
            padding: 24px;
        }
        .signin-card {
            background: linear-gradient(180deg, rgba(255,255,255,0.98), #fff 95%);
            border: 1px solid rgba(15, 23, 42, 0.08);
            border-radius: 24px;
            box-shadow: var(--shadow-lg);
            overflow: hidden;
        }
        .signin-body {
            padding: 28px 32px 32px;
        }
        .brand-flag {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 22px;
        }
        .brand-mark {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            border-radius: 14px;
            background: #fff;
            box-shadow: var(--shadow);
        }
        .brand-mark img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 14px;
        }
        .brand-title {
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--gray-900);
        }
        .brand-subtitle {
            font-size: 0.82rem;
            color: var(--gray-500);
        }
        .message-box {
            min-height: 40px;
            margin-bottom: 18px;
            border-radius: 14px;
            padding: 14px 16px;
            display: none;
            align-items: center;
            gap: 10px;
            font-size: 0.92rem;
        }
        .message-box.show {
            display: flex;
        }
        .message-box.success { background: rgba(39, 174, 96, 0.12); color: var(--success); }
        .message-box.error { background: rgba(231, 76, 60, 0.12); color: var(--danger); }
        .auth-form {
            display: none;
            gap: 16px;
            width: 100%;
        }
        .auth-form.active {
            display: grid;
        }
        .field-group {
            display: grid;
            gap: 14px;
        }
        .field-group label {
            font-size: 0.85rem;
            color: var(--gray-600);
        }
        .field-group input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid var(--gray-200);
            background: #fff;
            color: var(--gray-900);
            transition: border-color var(--transition), box-shadow var(--transition);
        }
        .field-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(11, 59, 92, 0.08);
        }
        .form-actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .form-actions .btn {
            width: 100%;
            padding: 14px 0;
            font-size: 0.95rem;
            border-radius: 14px;
        }
        .form-note {
            font-size: 0.86rem;
            color: var(--gray-500);
            line-height: 1.5;
        }
        .link-button {
            background: transparent;
            border: none;
            color: var(--primary);
            font-weight: 600;
            cursor: pointer;
            padding: 0;
            font-size: 0.86rem;
            line-height: 1.5;
        }
        .link-button:hover {
            text-decoration: underline;
        }
        .loading-overlay {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(7, 22, 39, 0.82);
            z-index: 1100;
        }
        .loading-overlay.show {
            display: flex;
        }
        .loading-panel {
            display: grid;
            place-items: center;
            gap: 18px;
            padding: 28px 32px;
            border-radius: 24px;
            background: rgba(255,255,255,0.98);
            box-shadow: 0 32px 80px rgba(7, 22, 39, 0.18);
            min-width: 260px;
            text-align: center;
        }
        .loader-logo {
            width: 100px;
            height: 100px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: linear-gradient(180deg, #fff 0%, #f5f7fb 100%);
            box-shadow: inset 0 0 0 1px rgba(7, 22, 39, 0.06), 0 18px 36px rgba(7, 22, 39, 0.12);
            position: relative;
            overflow: hidden;
        }
        .loader-logo-image {
            width: 64px;
            height: 64px;
            object-fit: contain;
            z-index: 1;
        }
        .loader-text {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--gray-900);
        }
    
        .loader-spinner {
            position: absolute;
            inset: 12px;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: var(--primary);
            animation: spin 1.4s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @media (max-width: 520px) {
            .signin-shell { padding: 18px; }
            /* removed hero banner; keep shell padding only */
            .signin-shell { padding: 24px; }
            .signin-body { padding: 24px; }
            .brand-flag { gap: 12px; }
        }
    </style>
</head>
<body>
    <div class="signin-shell">
        <div class="signin-card">
            <div class="signin-body">
                <div class="brand-flag">
                    <span class="brand-mark"><img src="image/MPWT LOGO.svg" alt="DocuFlow logo"></span>
                    <div>
                        <div class="brand-title">Ministry of Public Works and Transport</div>
                        <div class="brand-subtitle">International Cooperation Department</div>
                    </div>
                </div>

                <!-- top tabs removed; use inline switch links below -->

                <div id="messageBox" class="message-box"></div>

                <form id="loginFormSmall" class="auth-form active">
                    <div class="field-group">
                        <label for="loginEmailSmall">Email</label>
                        <input id="loginEmailSmall" type="email" placeholder="you@example.com" required>
                    </div>
                    <div class="field-group">
                        <label for="loginPasswordSmall">Password</label>
                        <input id="loginPasswordSmall" type="password" placeholder="Enter your password" required>
                    </div>
                    <div class="form-actions">
                        <button id="loginBtnSmall" type="submit" class="btn btn-primary">Sign in</button>
                        <div class="form-note">Need an account? <button id="showRegisterLink" type="button" class="link-button">Sign up</button></div>
                    </div>
                </form>

                <form id="registerFormSmall" class="auth-form">
                    <div class="field-group">
                        <label for="regNameSmall">Full name</label>
                        <input id="regNameSmall" type="text" placeholder="Your full name" required>
                    </div>
                    <div class="field-group">
                        <label for="regEmailSmall">Email</label>
                        <input id="regEmailSmall" type="email" placeholder="you@example.com" required>
                    </div>
                    <div class="field-group">
                        <label for="regPasswordSmall">Password</label>
                        <input id="regPasswordSmall" type="password" placeholder="Create a password" required>
                    </div>
                    <div class="field-group">
                        <label for="regRoleSmall">Role</label>
                        <select id="regRoleSmall">
                            <option value="user">User</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>
                    <div class="form-actions">
                        <button id="regBtnSmall" type="submit" class="btn btn-primary">Sign up</button>
                        <div class="form-note">Already have an account? <button id="showLoginLink" type="button" class="link-button">Sign in</button></div>
                    </div>
                </form>

            </div>
        </div>
    </div>
    <div id="loadingOverlay" class="loading-overlay" aria-hidden="true">
        <div class="loading-panel">
                <div class="loader-logo">
                    <img src="image/MPWT LOGO.svg" alt="DocuFlow logo" class="loader-logo-image">
                    <div class="loader-spinner"></div>
                </div>
            <div class="loader-text">Loading...</div>
        </div>
    </div>
    <script src="signin.js"></script>
</body>
</html>
